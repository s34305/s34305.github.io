<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พชรพล | Portfolio</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background:
                radial-gradient(circle at top, #292929 0%, #111 45%, #050505 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* จุดวิบวับพื้นหลัง */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 3px;
            height: 3px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow:
                80px 100px #fff3a0,
                180px 250px #ffd700,
                320px 120px #fff,
                450px 350px #ffd700,
                600px 180px #fff3a0,
                750px 450px #ffd700,
                900px 100px #fff,
                1050px 300px #ffd700,
                1200px 180px #fff3a0,
                1300px 500px #ffd700,
                150px 600px #fff,
                500px 650px #ffd700,
                850px 700px #fff3a0,
                1100px 650px #ffd700;
            animation: sparkle 3s infinite alternate;
        }

        body::after {
            animation-delay: 1.5s;
            opacity: 0.6;
            transform: scale(1.5);
        }

        @keyframes sparkle {
            0% {
                opacity: 0.2;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow:
                    80px 100px #ffd700,
                    180px 250px #fff,
                    320px 120px #ffd700,
                    450px 350px #fff3a0,
                    600px 180px #ffd700,
                    750px 450px #fff,
                    900px 100px #ffd700,
                    1050px 300px #fff3a0;
            }

            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* การ์ดหลัก */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
            padding: 55px 40px;
            text-align: center;

            background: rgba(20, 20, 20, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(212, 175, 55, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.6);

            backdrop-filter: blur(12px);

            animation: cardGlow 4s ease-in-out infinite;
        }

        @keyframes cardGlow {
            0%, 100% {
                box-shadow:
                    0 0 25px rgba(212, 175, 55, 0.08),
                    0 20px 60px rgba(0, 0, 0, 0.6);
            }

            50% {
                box-shadow:
                    0 0 45px rgba(212, 175, 55, 0.18),
                    0 20px 60px rgba(0, 0, 0, 0.6);
            }
        }

        /* เส้นทองด้านบน */
        .gold-line {
            width: 70px;
            height: 3px;
            margin: 0 auto 28px;

            background: linear-gradient(
                90deg,
                transparent,
                #d4af37,
                #fff2a8,
                #d4af37,
                transparent
            );

            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 25px;

            background: linear-gradient(
                90deg,
                #b8860b,
                #ffe68a,
                #d4af37,
                #fff2a8,
                #b8860b
            );

            background-size: 250% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;

            animation: goldText 4s linear infinite;
        }

        @keyframes goldText {
            to {
                background-position: 250% center;
            }
        }

        p {
            color: #d0d0d0;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
            font-weight: 300;
        }

        strong {
            color: #e5c158;
            font-weight: 600;
        }

        /* ปุ่ม */
        .btn {
            position: relative;
            display: inline-block;
            margin-top: 25px;
            padding: 13px 32px;

            color: #111;
            background: linear-gradient(
                135deg,
                #b8860b,
                #ffd700,
                #fff0a6,
                #d4af37
            );

            background-size: 200% 200%;

            text-decoration: none;
            border-radius: 50px;

            font-weight: 600;
            font-size: 16px;

            box-shadow:
                0 0 15px rgba(255, 215, 0, 0.25),
                0 5px 20px rgba(0, 0, 0, 0.4);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            animation: buttonGold 3s ease infinite;
        }

        @keyframes buttonGold {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.5),
                0 8px 25px rgba(0, 0, 0, 0.5);
        }

        /* เอฟเฟกต์แสงวิ่งบนปุ่ม */
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.7),
                transparent
            );

            transform: skewX(-20deg);
            transition: 0.6s;
        }

        .btn:hover::before {
            left: 150%;
        }

        /* มือถือ */
        @media (max-width: 600px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 23px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="gold-line"></div>

        <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน 🤘</h1>

        <p>
            สวัสดีครับ! ผมชื่อ
            <strong>พชรพล สันจะโป๊ะ</strong>
        </p>

        <p>
            <strong>Pacharapol Sanjapo</strong>
        </p>

        <p>
            กำลังศึกษา / สนใจด้าน
            <strong>Industrial Engineering</strong>
        </p>

        <p>
            เว็บไซต์แรกของผม<br>
            ที่โฮสต์บน GitHub Pages ✨
        </p>

       <a href="portfolio.html" class="btn">
    ✦ ดู Portfolio
</a>


    </div>

</body>
</html>
